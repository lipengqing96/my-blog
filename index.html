<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIPENGQING | ARCHIVE & DEALS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfc; color: #1a1a1a; margin: 0; }
        .serif { font-family: 'Playfair Display', serif; }

        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&q=80&w=2000');
            background-size: cover; background-position: center; z-index: -1;
        }

        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); z-index: -1;
        }

        .glass-card { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.8); }
        .hover-lift { transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
        .hover-lift:hover { transform: translateY(-12px); box-shadow: 0 40px 80px -20px rgba(0,0,0,0.1); }
        
        /* 稍微保留一点色彩，增加购买欲 */
        .img-style { filter: saturate(0.6); transition: all 0.8s; }
        .group:hover .img-style { filter: saturate(1.1); scale: 1.05; }
        
        #modal { display: none; opacity: 0; transition: opacity 0.3s ease; }
        #modal.active { display: flex; opacity: 1; }

        /* 文章内样式 */
        .prose h2 { font-family: 'Playfair Display', serif; font-size: 2rem; font-style: italic; font-weight: 800; margin-bottom: 1rem; color: #000; }
        .prose p { line-height: 1.8; color: #4b5563; margin-bottom: 1.5rem; }
        .affiliate-box {
            background: #f5f7ff; border: 2px dashed #c7d2fe; padding: 2rem;
            border-radius: 1.5rem; text-align: center; margin: 2rem 0;
        }
    </style>
</head>
<body class="antialiased">

    <div class="ambient-bg"></div>
    <div class="bg-overlay"></div>

    <nav class="sticky top-0 z-50 w-full glass-card border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 bg-black flex items-center justify-center rotate-3 rounded-lg">
                    <div class="w-2.5 h-2.5 bg-white rounded-sm"></div>
                </div>
                <a href="/" class="text-xl font-extrabold tracking-tighter text-black uppercase">lipengqing96</a>
            </div>
            <div class="text-[10px] font-bold text-gray-400">AMZON ASSOCIATE PARTNER</div>
        </div>
    </nav>

    <header class="max-w-7xl mx-auto px-6 py-20 text-center">
        <span class="text-[10px] uppercase tracking-[0.5em] text-indigo-500 font-bold mb-6 block">Curated Selection & Reviews</span>
        <h1 class="serif text-5xl md:text-8xl italic font-black tracking-tighter leading-none mb-10 text-gray-950">
            Smart <span class="text-gray-400">Shopping</span>
        </h1>
        <div class="w-20 h-1 bg-black mx-auto rounded-full"></div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10">
        <div id="magazine-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-10 gap-y-24">
            </div>
    </main>

    <footer class="bg-black text-white py-24 mt-40">
        <div class="max-w-7xl mx-auto px-6 text-center md:text-left grid grid-cols-1 md:grid-cols-2 gap-16">
            <div>
                <div class="serif text-4xl italic font-black tracking-tighter text-indigo-400 mb-8">LPQ Haitao.</div>
                <p class="text-gray-400 text-sm">作为联盟伙伴，我可能会通过您的购买获得佣金。这支持我继续分享好物。</p>
            </div>
            <div class="flex flex-col justify-end md:items-end">
                <h4 class="text-[10px] uppercase tracking-[0.4em] text-gray-600 font-bold mb-4">CONTACT</h4>
                <p class="text-sm text-gray-300">TG: @lpqhaitao</p>
            </div>
        </div>
    </footer>

    <div id="modal" class="fixed inset-0 z-[100] items-center justify-center p-4 md:p-10 bg-black/60 backdrop-blur-md">
        <div class="bg-white w-full max-w-4xl max-h-[90vh] overflow-y-auto rounded-[2.5rem] shadow-2xl relative">
            <button onclick="closeModal()" class="fixed md:absolute top-6 right-6 w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center font-bold hover:bg-black hover:text-white transition z-[110]">✕</button>
            <div id="modal-content" class="p-8 md:p-16">
                </div>
        </div>
    </div>

    <script>
        const CONFIG = { username: "lipengqing96", repo: "my-blog" };

        async function loadArchive() {
            const grid = document.getElementById('magazine-grid');
            try {
                const response = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/posts?t=${Date.now()}`);
                const files = await response.json();
                const mdFiles = files.filter(f => f.name.toLowerCase().endsWith('.md')).reverse();
                
                grid.innerHTML = ''; 
                for (const file of mdFiles) {
                    const res = await fetch(`${file.download_url}?t=${Date.now()}`);
                    const text = await res.text();

                    // 增强的数据抓取
                    const title = text.match(/title:\s*["']?(.*?)["']?(\r?\n)/)?.[1] || "精选好物";
                    const thumb = text.match(/thumbnail:\s*["']?(.*?)["']?(\r?\n)/)?.[1] || "https://images.unsplash.com/photo-1516131206008-dd041a9764fd?q=80&w=800";
                    const category = text.match(/category:\s*["']?(.*?)["']?(\r?\n)/)?.[1] || "Hot Deal";
                    const affLink = text.match(/aff_link:\s*["']?(.*?)["']?(\r?\n)/)?.[1] || "";
                    const content = text.replace(/---[\s\S]*?---/, '');

                    const card = `
                        <article class="group cursor-pointer" onclick="openModal('${encodeURIComponent(content)}', '${title}', '${thumb}', '${affLink}')">
                            <div class="relative aspect-[4/5] rounded-[2rem] overflow-hidden bg-gray-100 hover-lift mb-8 glass-card">
                                <img src="${thumb}" class="img-style w-full h-full object-cover">
                                <div class="absolute inset-0 bg-gradient-to-t from-gray-900/60 to-transparent"></div>
                                <div class="absolute top-6 left-6"><span class="px-3 py-1.5 bg-white text-[9px] font-black uppercase rounded-full shadow-sm">${category}</span></div>
                            </div>
                            <h3 class="serif text-3xl italic font-bold leading-tight group-hover:text-indigo-600 transition-colors">${title}</h3>
                        </article>
                    `;
                    grid.innerHTML += card;
                }
            } catch (err) { console.error(err); }
        }

        function openModal(encodedContent, title, thumb, affLink) {
            const content = decodeURIComponent(encodedContent);
            const container = document.getElementById('modal-content');
            
            // 自动生成购买按钮区块
            const affSection = affLink ? `
                <div class="affiliate-box">
                    <p class="text-xs font-bold text-indigo-500 uppercase tracking-widest mb-2">Editor's Choice</p>
                    <h4 class="text-xl font-bold mb-4">觉得不错？现在就有优惠链接</h4>
                    <a href="${affLink}" target="_blank" class="inline-block bg-indigo-600 text-white px-10 py-4 rounded-full font-bold hover:bg-black transition-all shadow-lg hover:scale-105">
                        立即前往官网购买 →
                    </a>
                </div>
            ` : '';

            container.innerHTML = `
                <img src="${thumb}" class="w-full h-72 md:h-96 object-cover rounded-[2rem] mb-10 shadow-lg">
                <h2 class="serif italic text-4xl md:text-5xl font-black mb-6">${title}</h2>
                ${affSection}
                <div class="prose max-w-none text-gray-700">${marked.parse(content)}</div>
            `;
            
            document.getElementById('modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        document.getElementById('modal').onclick = function(e) { if (e.target === this) closeModal(); };
        loadArchive();
    </script>
</body>
</html>
