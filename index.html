<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>LIPENGQING | ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 引入具有现代感和高级感的字体 */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfc; color: #1a1a1a; }
        .serif { font-family: 'Playfair Display', serif; }
        
        /* 动态呼吸感背景 */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(216, 180, 254, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(199, 210, 254, 0.15) 0%, transparent 40%);
            z-index: -1;
            filter: blur(100px);
        }

        /* 高级玻璃拟态卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* 优雅的鼠标悬停浮起和微细描边 */
        .hover-lift { transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
        .hover-lift:hover { 
            transform: translateY(-12px); 
            box-shadow: 0 40px 80px -20px rgba(0,0,0,0.1);
            border-color: rgba(99, 102, 241, 0.15);
        }
        
        /* 图片黑白到彩色的过渡 */
        .img-grayscale { filter: grayscale(100%); transition: filter 0.8s; }
        .group:hover .img-grayscale { filter: grayscale(0%); }

    </style>
</head>
