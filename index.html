<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBAL PICKS | ARCHIVE</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfc; color: #1a1a1a; margin: 0; }
        .serif { font-family: 'Playfair Display', serif; }
        .ambient-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&q=80&w=2000'); background-size: cover; background-position: center; z-index: -2; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.85); background-image: radial-gradient(#d1d5db 0.6px, transparent 0.6px); background-size: 24px 24px; backdrop-filter: blur(12px); z-index: -1; }
        .glass-card { background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.7); }
        .hover-lift { transition: all 0.8s cubic-bezier(0.15, 0.83, 0.66, 1); }
        .hover-lift:hover { transform: translateY(-15px); box-shadow: 0 50px 100px -20px rgba(0,0,0,0.05); }
        .img-wrapper { overflow: hidden; border-radius: 2.5rem; position: relative; background-color: #eee; min-height: 300px; }
        .img-grayscale { filter: grayscale(100%); transition: all 1s ease; object-fit: cover; width: 100%; height: 100%; }
        .group:hover .img-grayscale { filter: grayscale(0%); transform: scale(1.05); }
        #modal { display: none; }
        #modal.active { display: flex; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); }
        .buy-button { display: inline-flex; align-items: center; gap: 10px; background: #000; color: #fff; padding: 14px 36px; border-radius: 99px; font-weight: 700; text-decoration: none; margin: 20px 0; transition: all 0.4s; }
        .buy-button:hover { background: #4f46e5; transform: scale(1.05); }
        #search-input:focus { width: 240px; background: rgba(255,255,255,0.9); }
        @media (max-width: 640px) { #search-input:focus { width: 160px; } }
    </style>
</head>
<body class="antialiased">
    <div class="ambient-bg"></div>
    <div class="bg-overlay"></div>
    
    <nav class="sticky top-0 z-50 w-full glass-card border-b border-gray-100/50">
        <div class="max-w-7xl mx-auto px-8 h-24 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <div class="w-10 h-10 bg-black flex items-center justify-center rotate-12 rounded-xl shadow-lg text-white font-black text-[10px]">GP</div>
                <a href="/" class="text-2xl font-black tracking-tighter text-black uppercase">Global Picks</a>
            </div>
            
            <div class="relative flex items-center">
                <input type="text" id="search-input" placeholder="Search insights..." 
                    class="w-32 md:w-48 px-4 py-2 rounded-full border border-gray-200 text-sm outline-none transition-all duration-500 bg-white/50 focus:ring-2 focus:ring-indigo-400">
                <svg class="w-4 h-4 absolute right-3 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>
    </nav>

    <header class="max-w-7xl mx-auto px-8 py-32 text-center">
        <span class="text-[11px] uppercase tracking-[0.6em] text-indigo-500 font-extrabold mb-8 block">Curated Intelligence Archive</span>
        <h1 class="serif text-7xl md:text-9xl italic font-black tracking-tighter leading-none mb-12 text-gray-950">Smart <span class="text-gray-300">Curation</span></h1>
        <div class="w-24 h-1.5 bg-indigo-500 mx-auto rounded-full"></div>
    </header>

    <main class="max-w-7xl mx-auto px-8">
        <div id="magazine-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-12 gap-y-28">
            <div id="loading-state" class="col-span-full text-center py-20 serif italic text-2xl text-gray-400">Connecting to Archive...</div>
        </div>
    </main>

    <footer class="bg-black text-white py-32 mt-48">
        <div class="max-w-7xl mx-auto px-8 grid grid-cols-1 md:grid-cols-2 gap-24">
            <div>
                <div class="serif text-5xl italic font-black tracking-tighter text-indigo-400 mb-8">Global Picks.</div>
                <p class="text-gray-500 text-sm">Leading the edge of global product sourcing.</p>
            </div>
            <div class="flex flex-col justify-end md:items-end">
                <p class="text-xl font-bold text-gray-200">WhatsApp: +86 155 5692 8232</p>
            </div>
        </div>
    </footer>

    <div id="modal" onclick="if(event.target === this) closeModal()">
        <div class="bg-white w-full max-w-5xl max-h-[92vh] overflow-y-auto rounded-[3.5rem] shadow-2xl relative m-4">
            <button onclick="closeModal()" class="absolute top-10 right-10 w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center font-bold hover:bg-black hover:text-white transition z-10 shadow-sm">✕</button>
            <div id="modal-content" class="p-8 md:p-16 prose max-w-none"></div>
        </div>
    </div>

    <script>
        const CONFIG = { username: "lipengqing96", repo: "my-blog" };
        let allPosts = []; 

        async function loadArchive() {
            const grid = document.getElementById('magazine-grid');
            try {
                // 1. 获取文件列表，增加随机参数绕过 GitHub API 缓存
                const response = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/posts?nocache=${Date.now()}`);
                
                if (!response.ok) throw new Error("API_LIMIT_OR_NOT_FOUND");

                const files = await response.json();
                // 2. 筛选 .md 文件
                const mdFiles = files.filter(f => f.name.toLowerCase().endsWith('.md')).reverse();
                
                if (mdFiles.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-center py-20 text-gray-400 italic font-serif text-2xl">Your archive is currently empty.</div>';
                    return;
                }

                allPosts = [];
                const loader = document.getElementById('loading-state');
                if(loader) loader.remove();

                for (const file of mdFiles) {
                    try {
                        const res = await fetch(file.download_url);
                        const text = await res.text();
                        
                        const title = (text.match(/title:\s*["']?([\s\S]*?)["']?(\r?\n|$)/) || [])[1] || "Untitled";
                        const thumb = (text.match(/thumbnail:\s*["']?([\s\S]*?)["']?(\r?\n|$)/) || [])[1] || "https://images.unsplash.com/photo-1516131206008-dd041a9764fd?q=80&w=800";
                        const category = (text.match(/category:\s*["']?([\s\S]*?)["']?(\r?\n|$)/) || [])[1] || "Apparel";
                        const affLink = (text.match(/aff_link:\s*["']?([\s\S]*?)["']?(\r?\n|$)/) || [])[1] || "";
                        const content = text.replace(/---[\s\S]*?---/, '');
                        
                        const postObj = { title, thumb, category, affLink, content };
                        allPosts.push(postObj);
                        
                        appendCard(postObj);
                    } catch (e) { 
                        console.warn("Skip invalid file:", file.name);
                    }
                }
            } catch (err) { 
                console.error(err);
                grid.innerHTML = `
                    <div class="col-span-full text-center py-20">
                        <p class="serif italic text-2xl text-gray-400 mb-6">Archive syncing... Please wait a moment.</p>
                        <button onclick="location.reload()" class="buy-button">Reload Gallery</button>
                    </div>`;
            }
        }

        function appendCard(post) {
            const grid = document.getElementById('magazine-grid');
            const safeTitle = post.title.replace(/'/g, "\\'");
            const cardHtml = `
                <article class="group cursor-pointer" onclick="openModal(\`${encodeURIComponent(post.content)}\`, '${safeTitle}', '${post.thumb}', '${post.affLink}')">
                    <div class="img-wrapper aspect-[4/5] hover-lift glass-card mb-10">
                        <img src="${post.thumb}" class="img-grayscale" onerror="this.src='https://images.unsplash.com/photo-1516131206008-dd041a9764fd?q=80&w=800'">
                        <div class="absolute inset-0 bg-gradient-to-t from-gray-900/40 to-transparent opacity-60"></div>
                        <div class="absolute top-8 left-8"><span class="px-4 py-2 bg-white/90 text-[10px] font-black uppercase rounded-full shadow-sm">${post.category}</span></div>
                    </div>
                    <h3 class="serif text-4xl italic font-bold leading-[1.2] px-2">${post.title}</h3>
                </article>`;
            grid.insertAdjacentHTML('beforeend', cardHtml);
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const grid = document.getElementById('magazine-grid');
            grid.innerHTML = '';
            const filtered = allPosts.filter(p => p.title.toLowerCase().includes(term) || p.category.toLowerCase().includes(term));
            filtered.forEach(appendCard);
        });

        function openModal(encodedContent, title, thumb, affLink) {
            const content = decodeURIComponent(encodedContent);
            const modal = document.getElementById('modal');
            const container = document.getElementById('modal-content');
            const buyBtn = affLink ? `<div class="my-10 p-10 bg-gray-50 rounded-[2.5rem] flex flex-col md:flex-row items-center justify-between gap-6"><h4 class="text-2xl font-bold">Access the Selection</h4><a href="${affLink}" target="_blank" class="buy-button">Explore / Order →</a></div>` : '';
            container.innerHTML = `<div class="rounded-[3rem] overflow-hidden shadow-2xl mb-16"><img src="${thumb}" class="w-full h-[400px] object-cover"></div><h2 class="serif italic text-gray-950 font-black">${title}</h2>${buyBtn}<div class="markdown-body prose max-w-none text-gray-700 text-lg">${marked.parse(content)}</div>`;
            modal.classList.add('active'); document.body.style.overflow = 'hidden';
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); document.body.style.overflow = 'auto'; }
        
        loadArchive();
    </script>
</body>
</html>
