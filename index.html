<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全域探索 | 综合生活志</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        /* 这里的背景图可以手动修改 URL */
        .hero-bg { background-image: url('https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&q=80&w=2000'); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <nav class="glass-nav sticky top-0 z-50 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="text-2xl font-black tracking-tight text-indigo-600">UNIVERSE<span class="text-slate-400">LOG</span></div>
            <div class="hidden md:flex space-x-6 text-sm font-semibold text-slate-600">
                <a href="/" class="text-indigo-600">首页</a>
                <a href="#" class="hover:text-indigo-600 transition">科技评测</a>
                <a href="#" class="hover:text-indigo-600 transition">美妆护理</a>
                <a href="/admin/" class="hover:text-indigo-600 transition">管理后台</a>
            </div>
            <div class="flex items-center space-x-4">
                <a href="/admin/" class="text-sm font-medium border border-slate-300 px-4 py-1.5 rounded-lg hover:bg-slate-50">登录后台</a>
            </div>
        </div>
    </nav>

    <header class="max-w-7xl mx-auto px-4 py-10">
        <div class="relative rounded-3xl overflow-hidden aspect-[21/9] md:aspect-[3/1] bg-slate-900 hero-bg bg-cover bg-center">
            <div class="absolute inset-0 bg-black/40 flex flex-col justify-center p-8 md:p-16">
                <span class="text-indigo-400 font-bold tracking-widest text-sm mb-4"># 2026 趋势报告</span>
                <h1 class="text-white text-3xl md:text-5xl font-bold max-w-2xl leading-tight">全品类进化：从智能硬件到护肤美学的跨界融合</h1>
                <p class="text-slate-300 mt-4 max-w-lg hidden md:block">我们打破行业的藩篱，为你呈现最真实的消费决策参考。</p>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-12">
        <div class="flex flex-col md:flex-row justify-between items-end mb-10 gap-4">
            <div>
                <h2 class="text-3xl font-bold">深度内容</h2>
                <p class="text-slate-500 mt-2">Latest Insights & Reviews</p>
            </div>
            <div class="flex bg-white p-1 rounded-xl shadow-sm border border-slate-200 text-sm font-medium">
                <button class="px-6 py-2 bg-indigo-600 text-white rounded-lg">全部文章</button>
            </div>
        </div>

        <div id="post-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <div class="text-slate-400 py-10 text-center col-span-full">正在探索深度内容...</div>
        </div>

        <section class="mt-24 bg-indigo-600 rounded-[32px] p-10 md:p-20 text-center text-white">
            <h2 class="text-3xl md:text-4xl font-bold mb-6">获取每周好物推荐</h2>
            <p class="text-indigo-100 mb-10 max-w-md mx-auto">加入我们的邮件列表，第一时间获取深度评测报告和独家消费优惠。</p>
            <div class="max-w-md mx-auto flex flex-col md:flex-row gap-4">
                <input type="email" placeholder="你的邮箱地址" class="flex-1 px-6 py-4 rounded-2xl text-slate-900 focus:outline-none">
                <button class="bg-slate-900 text-white px-8 py-4 rounded-2xl font-bold hover:bg-slate-800 transition">立即订阅</button>
            </div>
        </section>
    </main>

    <footer class="border-t border-slate-200 pt-16 pb-8 mt-12 bg-white text-center">
        <p class="text-slate-400 text-sm">© 2026 UNIVERSELOG. 连接你的全维度生活方式.</p>
    </footer>

    <script>
        async function loadPosts() {
            const container = document.getElementById('post-container');
            const repoOwner = "你的GitHub用户名"; // 必须修改：你的 GitHub 账号名
            const repoName = "my-blog";         // 你的仓库名

            try {
                // 向 GitHub API 请求 posts 文件夹列表
                const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/posts`);
                const files = await response.json();
                
                if (files.length > 0) {
                    container.innerHTML = ''; // 清空加载提示
                    
                    // 只展示最近的 6 篇文章
                    for (let file of files.reverse().slice(0, 6)) {
                        if (file.name.endsWith('.md')) {
                            const postRes = await fetch(file.download_url);
                            const content = await postRes.text();
                            
                            // 简单的解析器：抓取标题和图片
                            const title = content.match(/title:\s*(.*)/)?.[1] || "未命名文章";
                            const imgMatch = content.match(/thumbnail:\s*(.*)/) || content.match(/image:\s*(.*)/);
                            const image = imgMatch ? imgMatch[1].replace(/['"]/g, '') : 'https://via.placeholder.com/800x600?text=No+Image';
                            const date = content.match(/date:\s*(.*)/)?.[1]?.split('T')[0] || "2026-05-08";

                            // 生成 HTML 卡片
                            const card = `
                                <article class="group cursor-pointer">
                                    <div class="relative overflow-hidden rounded-2xl mb-5 shadow-lg bg-slate-200">
                                        <img src="${image}" class="w-full h-64 object-cover group-hover:scale-110 transition duration-700" onerror="this.src='https://via.placeholder.com/800x600?text=Image+Error'">
                                    </div>
                                    <h3 class="text-xl font-bold group-hover:text-indigo-600 transition leading-snug">${title}</h3>
                                    <div class="flex items-center mt-6 space-x-3 text-xs text-slate-400">
                                        <div class="w-6 h-6 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-bold">U</div>
                                        <span>发布于 ${date}</span>
                                    </div>
                                </article>
                            `;
                            container.innerHTML += card;
                        }
                    }
                }
            } catch (error) {
                console.error("加载失败:", error);
                container.innerHTML = '<div class="col-span-full text-center text-slate-400">暂时无法加载内容，请检查 GitHub 仓库配置。</div>';
            }
        }
        loadPosts();
    </script>
</body>
</html>
