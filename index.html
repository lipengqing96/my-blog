    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; 
            background-color: #f8f9fa;
        }

        /* 极简时尚背景设置 */
        .page-background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            /* 选用一张极具现代审美、光影柔和的背景图 */
            background-image: url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
            z-index: -2;
        }

        /* 高级磨砂感遮罩，确保文字易读 */
        .page-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(15px);
            z-index: -1;
        }

        .serif { font-family: 'Playfair Display', serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        
        .hover-lift { transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1); }
        .hover-lift:hover { transform: translateY(-8px); box-shadow: 0 30px 60px -15px rgba(0,0,0,0.1); }
        
        #modal { display: none; opacity: 0; transition: opacity 0.3s ease; }
        #modal.active { display: flex; opacity: 1; }
        .prose h2 { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-style: italic; font-weight: 800; margin-bottom: 1.5rem; }
        .prose p { line-height: 1.8; color: #374151; margin-bottom: 1.25rem; }
    </style>
</head>

    <script>
        const CONFIG = { username: "lipengqing96", repo: "my-blog" };

        async function loadArchive() {

                const mdFiles = files.filter(f => f.name.toLowerCase().endsWith('.md')).reverse();
