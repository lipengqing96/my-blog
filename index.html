<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBAL PICKS | ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfc; color: #1a1a1a; margin: 0; }
        .serif { font-family: 'Playfair Display', serif; }
        .ambient-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&q=80&w=2000'); background-size: cover; background-position: center; z-index: -2; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); z-index: -1; }
        .glass-card { background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.7); }
        .hover-lift { transition: all 0.8s cubic-bezier(0.15, 0.83, 0.66, 1); }
        .hover-lift:hover { transform: translateY(-12px); box-shadow: 0 40px 80px -20px rgba(0,0,0,0.05); }
        .img-wrapper { overflow: hidden; border-radius: 2.5rem; position: relative; background-color: #eee; height: 450px; }
        .img-grayscale { filter: grayscale(100%); transition: all 1s ease; object-fit: cover; width: 100%; height: 100%; }
        .group:hover .img-grayscale { filter: grayscale(0%); transform: scale(1.05); }
        #modal { display: none; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); }
        #modal.active { display: flex; }
        .buy-button { display: inline-flex; align-items: center; gap: 10px; background: #000; color: #fff; padding: 14px 36px; border-radius: 99px; font-weight: 700; text-decoration: none; margin: 20px 0; transition: 0.4s; }
        #search-input { background: rgba(255,255,255,0.7); border: 1px solid rgba(0,0,0,0.05); }
    </style>
</head>
<body class="antialiased">
    <div class="ambient-bg"></div>
    <div class="bg-overlay"></div>
    
    <nav class="sticky top-0 z-50 w-full glass-card border-b border-gray-100/50">
        <div class="max-w-7xl mx-auto px-8 h-24 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <div class="w-10 h-10 bg-black flex items-center justify-center rotate-12 rounded-xl text-white font-black text-[10px]">GP</div>
                <a href="/" class="text-2xl font-black tracking-tighter uppercase">Global Picks</a>
            </div>
            <input type="text" id="search-input" placeholder="Search..." class="px-5 py-2 rounded-full text-sm outline-none w-32 md:w-48 focus:w-64 transition-all">
        </div>
    </nav>

    <header class="max-w-7xl mx-auto px-8 py-20 text-center">
        <h1 class="serif text-6xl md:text-8xl italic font-black tracking-tighter text-gray-900">Smart <span class="text-gray-300">Curation</span></h1>
    </header>

    <main class="max-w-7xl mx-auto px-8 pb-32">
        <div id="magazine-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
            <div class="col-span-full text-center py-20 text-gray-400 italic">Initializing Archive...</div>
        </div>
    </main>

    <div id="modal" onclick="if(event.target === this) closeModal()">
        <div class="bg-white w-full max-w-5xl max-h-[90vh] overflow-y-auto rounded-[3rem] shadow-2xl relative m-4">
            <button onclick="closeModal()" class="absolute top-8 right-8 w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center font-bold z-10">✕</button>
            <div id="modal-content" class="p-8 md:p-16"></div>
        </div>
    </div>

    <script>
        const CONFIG = { username: "lipengqing96", repo: "my-blog" };
        let allPosts = [];

        async function init() {
            const grid = document.getElementById('magazine-grid');
            try {
                // 使用时间戳防止 API 缓存
                const res = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/posts?t=${Date.now()}`);
                const files = await res.json();
                const mdFiles = files.filter(f => f.name.endsWith('.md')).reverse();
                
                allPosts = [];
                for (const file of mdFiles) {
                    const postRes = await fetch(file.download_url);
                    const text = await postRes.text();
                    
                    const title = text.match(/title:\s*["']?(.*?)["']?(\r?\n)/)?.[1] || "Untitled";
                    const thumb = text.match(/thumbnail:\s*["']?(.*?)["']?(\r?\n)/)?.[1] || "";
                    const category = text.match(/category:\s*["']?(.*?)["']?(\r?\n)/)?.[1] || "Global";
                    const affLink = text.match(/aff_link:\s*["']?(.*?)["']?(\r?\n)/)?.[1] || "";
                    const content = text.replace(/---[\s\S]*?---/, '');
                    
                    allPosts.push({ title, thumb, category, affLink, content });
                    render(allPosts); // 抓到一个显示一个
                }
            } catch (e) {
                grid.innerHTML = "Error loading posts.";
                console.error(e);
            }
        }

        function render(posts) {
            const grid = document.getElementById('magazine-grid');
            grid.innerHTML = posts.map(p => `
                <article class="group cursor-pointer" onclick="openModal(\`${encodeURIComponent(p.content)}\`, '${p.title.replace(/'/g, "\\'")}', '${p.thumb}', '${p.affLink}')">
                    <div class="img-wrapper hover-lift mb-6">
                        <img src="${p.thumb}" class="img-grayscale" onerror="this.src='https://images.unsplash.com/photo-1516131206008-dd041a9764fd?q=80&w=800'">
                        <div class="absolute top-6 left-6"><span class="px-3 py-1 bg-white/90 text-[10px] font-black uppercase rounded-full shadow-sm">${p.category}</span></div>
                    </div>
                    <h3 class="serif text-3xl italic font-bold px-2">${p.title}</h3>
                </article>
            `).join('');
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = allPosts.filter(p => p.title.toLowerCase().includes(val) || p.category.toLowerCase().includes(val));
            render(filtered);
        });

        function openModal(content, title, thumb, link) {
            const modal = document.getElementById('modal-content');
            const btn = link ? `<div class="my-10 p-8 bg-gray-50 rounded-[2rem] flex justify-between items-center"><div><h4 class="text-xl font-bold">Interested?</h4></div><a href="${link}" target="_blank" class="buy-button">Explore →</a></div>` : '';
            modal.innerHTML = `<img src="${thumb}" class="w-full h-80 object-cover rounded-[2rem] mb-10"><h2 class="serif text-5xl italic font-black mb-6">${title}</h2>${btn}<div class="prose max-w-none text-lg text-gray-700">${marked.parse(decodeURIComponent(content))}</div>`;
            document.getElementById('modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        init();
    </script>
</body>
</html>
