<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFFILIATE PULSE | Premium Brand Growth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,900&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050505; color: #fff; overflow-x: hidden; }
        .serif { font-family: 'Playfair Display', serif; }
        
        /* 氛围感背景 */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(79, 70, 229, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(67, 56, 202, 0.1) 0%, transparent 40%);
            z-index: -1;
        }

        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        .hover-up { transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1); }
        .hover-up:hover { transform: translateY(-12px); border-color: rgba(99, 102, 241, 0.4); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
    </style>
</head>
<body class="antialiased">

    <div class="ambient-bg"></div>

    <nav class="sticky top-0 z-50 w-full border-b border-white/5 bg-black/20 backdrop-blur-lg">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <span class="text-white font-bold tracking-tighter italic">P</span>
                </div>
                <a href="/" class="serif text-xl font-bold italic tracking-tight">Affiliate Pulse.</a>
            </div>
            <div class="text-[10px] uppercase tracking-[0.4em] font-bold text-white/40">
                Data Driven <span class="text-indigo-400">•</span> 2026 Edition
            </div>
        </div>
    </nav>

    <header class="max-w-7xl mx-auto px-6 pt-24 pb-32">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-16 items-center">
            <div class="lg:col-span-8">
                <div class="inline-flex items-center space-x-3 mb-8 px-4 py-2 rounded-full border border-white/10 bg-white/5">
                    <span class="w-2 h-2 bg-indigo-500 rounded-full animate-ping"></span>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-indigo-300">Scaling Brands Globally</span>
                </div>
                <h1 class="serif text-6xl md:text-8xl font-black italic leading-none mb-10 tracking-tight">
                    Premium <br> <span class="text-indigo-500">Traffic</span> Partner.
                </h1>
                <p class="text-white/50 text-xl max-w-2xl leading-relaxed mb-12 font-light">
                    我们通过精准流量分发与深度内容营销，赋能品牌出海。提供 TikTok 广告投放、3C 数码及高佣充值领域的一站式增长方案。
                </p>
                <div class="flex items-center space-x-8">
                    <button class="px-10 py-5 bg-indigo-600 text-white rounded-xl font-bold text-sm uppercase tracking-[0.2em] hover:bg-indigo-500 transition shadow-xl shadow-indigo-500/20">
                        Inquiry Now
                    </button>
                    <div class="hidden sm:block">
                        <p class="text-2xl font-bold italic serif">2.4M+</p>
                        <p class="text-[9px] uppercase tracking-widest text-white/30">Monthly Impressions</p>
                    </div>
                </div>
            </div>
            <div class="lg:col-span-4 hidden lg:block">
                <div class="relative group">
                    <div class="absolute -inset-1 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl blur opacity-20 group-hover:opacity-40 transition"></div>
                    <div class="relative aspect-[3/4] rounded-2xl overflow-hidden border border-white/10">
                        <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=1200" class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700" alt="Data View">
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-20">
        <div class="flex items-baseline justify-between mb-20 border-b border-white/5 pb-8">
            <h2 class="serif text-4xl italic font-bold">Insights & Analysis</h2>
