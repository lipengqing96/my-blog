<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBAL PICKS | ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfc; color: #1a1a1a; margin: 0; }
        .serif { font-family: 'Playfair Display', serif; }

        /* 基础背景层 */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&q=80&w=2000');
            background-size: cover; background-position: center; z-index: -2;
        }

        /* 蒙层 + 淡淡的网格纹理 */
        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.85);
            background-image: radial-gradient(#e5e7eb 0.5px, transparent 0.5px);
            background-size: 30px 30px;
            backdrop-filter: blur(10px); z-index: -1;
        }

        .glass-card { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.8); }
        .hover-lift { transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
        .hover-lift:hover { transform: translateY(-12px); box-shadow: 0 40px 80px -20px rgba(0,0,0,0.1); }
        
        .img-grayscale { filter: grayscale(100%); transition: filter 0.8s; }
        .group:hover .img-grayscale { filter: grayscale(0%); }
        
        #modal { display: none; }
        #modal.active { display: flex; opacity: 1; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        
        .prose h2 { font-family: 'Playfair Display', serif; font-size: 2.5rem; font-style: italic; font-weight: bold; margin-bottom: 1.5rem; }
        .prose p { margin-top: 1rem; line-height: 1.8; color: #4b5563; }
        
        .buy-button {
            display: inline-block; background: #000; color: #fff; padding: 12px 30px; 
            border-radius: 99px; font-weight: bold; text-decoration: none; margin: 20px 0;
            transition: transform 0.3s;
        }
        .buy-button:hover { transform: scale(1.05); background: #4f46e5; }
    </style>
</head>
<body class="antialiased">

    <div class="ambient-bg"></div>
    <div class="bg-overlay"></div>

    <nav class="sticky top-0 z-50 w-full glass-card border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 bg-black flex items-center justify-center rotate-3 rounded-lg text-white font-bold text-[8px]">GP</div>
                <a href="/" class="text-xl font-extrabold tracking-tighter text-black uppercase">Global Picks</a>
            </div>
        </div>
    </nav>

    <header class="max-w-7xl mx-auto px-6 py-24 text-center">
        <span class="text-[10px] uppercase tracking-[0.5em] text-indigo-400 font-bold mb-6 block">The Digital Notebook</span>
        <h1 class="serif text-6xl md:text-8xl italic font-black tracking-tighter leading-none mb-10 text-gray-950">
            Selected <span class="text-gray-400">Archive</span>
        </h1>
        <div class="w-20 h-1 bg-black mx-auto rounded-full"></div>
    </header>

    <main class="max-w-7xl mx-auto px-6">
        <div id="magazine-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-10 gap-y-24">
            <div class="col-span-full py-20 text-center serif italic text-3xl text-gray-200 animate-pulse">Syncing...</div>
        </div>
    </main>

    <a href="https://wa.me/8615556928232" target="_blank" class="fixed bottom-8 right-8 z-[60] bg-green-500 text-white p-4 rounded-full shadow-2xl hover:scale-110 transition-transform">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.414 0 .015 5.398.015 12.03c0 2.123.543 4.197 1.574 6.038L0 24l6.105-1.602a11.832 11.832 0 005.937 1.603h.005c6.637 0 12.035-5.399 12.035-12.032a11.761 11.761 0 00-3.489-8.492"/></svg>
    </a>

    <footer class="bg-black text-white py-24 mt-40">
        <div class="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-16">
            <div>
                <div class="serif text-4xl italic font-black tracking-tighter text-indigo-400 mb-8">Global Picks.</div>
                <p class="text-gray-400 text-sm leading-relaxed">Curated insights on global commerce and marketing strategies.</p>
            </div>
            <div class="flex flex-col justify-end md:items-end text-right">
                <h4 class="text-[10px] uppercase tracking-[0.4em] text-gray-600 font-bold mb-4">DIRECT CONTACT</h4>
                <p class="text-sm font-medium text-gray-300">WhatsApp: +86 15556928232</p>
            </div>
        </div>
    </footer>

    <div id="modal" onclick="if(event.target === this) closeModal()">
        <div class="bg-white w-full max-w-4xl max-h-[90vh] overflow-y-auto rounded-[2.5rem] shadow-2xl relative m-4">
            <button onclick="closeModal()" class="absolute top-8 right-8 w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center font-bold hover:bg-black hover:text-white transition z-10 shadow-sm">✕</button>
            <div id="modal-content" class="p-8 md:p-16 prose max-w-none"></div>
        </div>
    </div>

    <script>
        const CONFIG = { username: "lipengqing96", repo: "my-blog" };

        async function loadArchive() {
            const grid = document.getElementById('magazine-grid');
            try {
                const response = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/posts?t=${Date.now()}`);
                const files = await response.json();
                const mdFiles = files.filter(f => f.name.toLowerCase().endsWith('.md')).reverse();
                
                grid.innerHTML = ''; 
                for (const file of mdFiles) {
                    const res = await fetch(`${file.download_url}?t=${Date.now()}`);
                    const text = await res.text();

                    const title = text.match(/title:\s*["']?(.*?)["']?(\r?\n)/)?.[1] || "Untitled Post";
                    const thumb = text.match(/thumbnail:\s*["']?(.*?)["']?(\r?\n)/)?.[1] || "https://images.unsplash.com/photo-1516131206008-dd041a9764fd?q=80&w=800";
                    const category = text.match(/category:\s*["']?(.*?)["']?(\r?\n)/)?.[1] || "Insights";
                    const affLink = text.match(/aff_link:\s*["']?(.*?)["']?(\r?\n)/)?.[1] || "";
                    const content = text.replace(/---[\s\S]*?---/, '');

                    const safeTitle = title.replace(/'/g, "\\'");

                    const card = `
                        <article class="group cursor-pointer" onclick="openModal(\`${encodeURIComponent(content)}\`, '${safeTitle}', '${thumb}', '${affLink}')">
                            <div class="relative aspect-[4/5] rounded-[2rem] overflow-hidden bg-gray-100 hover-lift mb-8 glass-card shadow-sm border border-white/50">
                                <img src="${thumb}" class="img-grayscale w-full h-full object-cover transition-transform duration-1000 group-hover:scale-105">
                                <div class="absolute inset-0 bg-gradient-to-t from-gray-900/40 to-transparent"></div>
                                <div class="absolute top-6 left-6"><span class="px-3 py-1.5 bg-white text-[9px] font-black uppercase rounded-full shadow-sm">${category}</span></div>
                            </div>
                            <h3 class="serif text-3xl italic font-bold leading-tight group-hover:text-indigo-600 transition-colors">${title}</h3>
                        </article>
                    `;
                    grid.innerHTML += card;
                }
            } catch (err) { console.error(err); }
        }

        function openModal(encodedContent, title, thumb, affLink) {
            const content = decodeURIComponent(encodedContent);
            const modal = document.getElementById('modal');
            const container = document.getElementById('modal-content');
            
            const buyBtn = affLink ? `<a href="${affLink}" target="_blank" class="buy-button">View Details / Buy Now →</a>` : '';

            container.innerHTML = `
                <img src="${thumb}" class="w-full h-64 object-cover rounded-[1.5rem] mb-10 shadow-lg">
                <h2 class="serif italic text-4xl mb-4 font-black">${title}</h2>
                ${buyBtn}
                <div class="markdown-body text-lg text-gray-700 leading-relaxed">${marked.parse(content)}</div>
            `;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        loadArchive();
    </script>
</body>
</html>
