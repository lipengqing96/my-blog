<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFFILIATE PULSE | High-Conversion Marketing Insights</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fafafa; color: #1a1a1a; }
        .serif { font-family: 'Playfair Display', serif; }
        .nav-blur { background: rgba(255, 255, 255, 0.7); backdrop-filter: saturate(180%) blur(20px); }
        .hover-lift { transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .hover-lift:hover { transform: translateY(-8px); }
        .hero-gradient { background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.8) 100%); }
        .active-link { color: #4f46e5; border-bottom: 2px solid #4f46e5; }
    </style>
</head>
<body>

    <nav class="nav-blur sticky top-0 z-50 border-b border-black/5">
        <div class="max-w-6xl mx-auto px-6 h-20 flex justify-between items-center">
            <div class="serif text-2xl font-bold italic tracking-tighter cursor-pointer" onclick="filterPosts('All')">Affiliate Pulse.</div>
            
            <div class="hidden md:flex space-x-8 text-[11px] uppercase tracking-[0.2em] font-bold text-black/60">
                <button onclick="filterPosts('Apparel')" class="nav-item hover:text-black transition">Apparel</button>
                <button onclick="filterPosts('Travel')" class="nav-item hover:text-black transition">Travel</button>
                <button onclick="filterPosts('Tech')" class="nav-item hover:text-black transition">Tech</button>
                <button onclick="filterPosts('3C')" class="nav-item hover:text-black transition">3C</button>
                <button onclick="filterPosts('Top-up')" class="nav-item hover:text-black transition">Top-up</button>
            </div>

            <div class="text-[11px] uppercase tracking-widest font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">Pro Member</div>
        </div>
    </nav>

    <header class="max-w-6xl mx-auto px-6 py-8">
        <div class="relative rounded-sm overflow-hidden aspect-[16/9] md:aspect-[21/8] shadow-2xl">
            <img src="https://images.unsplash.com/photo-1434030216411-0b793f4b4173?auto=format&fit=crop&q=80&w=2000" class="absolute inset-0 w-full h-full object-cover" alt="Hero">
            <div class="absolute inset-0 hero-gradient flex flex-col justify-end p-8 md:p-16 text-white">
                <span class="text-[10px] uppercase tracking-[0.4em] mb-4 text-indigo-400 font-bold">Passive Income Masterclass</span>
                <h1 class="serif text-4xl md:text-6xl italic leading-none max-w-4xl">Mastering the Art of Affiliate Marketing: From Traffic to Profit.</h1>
                <div class="mt-6 flex items-center space-x-4">
                    <div class="h-[1px] w-12 bg-indigo-500"></div>
                    <p class="text-xs uppercase tracking-widest opacity-90 text-white">Scale Your Revenue in 2026</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-16">
        <div class="flex items-baseline justify-between mb-12 border-b border-black/10 pb-4">
            <h2 id="category-title" class="serif text-3xl italic">Latest Stories</h2>
            <span class="text-[10px] uppercase tracking-widest text-black/40">Affiliate Insights</span>
        </div>

        <div id="magazine-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-12 gap-y-20">
            <div class="col-span-full py-20 text-center serif italic text-2xl text-black/20 animate-pulse">Analyzing market data...</div>
        </div>
    </main>

    <footer class="py-12 text-center border-t border-black/5">
        <p class="serif italic text-sm text-black/40">© 2026 Affiliate Pulse Magazine. Data-Driven Marketing.</p>
    </footer>

    <script>
        const CONFIG = { username: "lipengqing96", repo: "my-blog" };
        let allPosts = []; // 存储所有抓取到的文章

        async function loadMagazine() {
            try {
                const response = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/posts`);
                const files = await response.json();
                const mdFiles = files.filter(f => f.name.endsWith('.md')).reverse();
                
                for (const file of mdFiles) {
                    const res = await fetch(file.download_url);
                    const text = await res.text();
                    const title = text.match(/title:\s*["']?(.*?)["']?(\r?\n)/)?.[1] || "Untitled";
                    const thumb = text.match(/thumbnail:\s*["']?(.*?)["']?(\r?\n)/)?.[1] || "https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=800";
                    const category = text.match(/category:\s*["']?(.*?)["']?(\r?\n)/)?.[1] || "Uncategorized";
                    
                    allPosts.push({ title, thumb, category });
                }
                renderPosts(allPosts);
            } catch (err) {
                document.getElementById('magazine-grid').innerHTML = '<p class="col-span-full text-center serif italic">Failed to sync stories.</p>';
            }
        }

        function renderPosts(posts) {
            const grid = document.getElementById('magazine-grid');
            if (posts.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center serif italic">No articles found in this category.</p>';
                return;
            }
            grid.innerHTML = posts.map(post => `
                <article class="group cursor-pointer hover-lift">
                    <div class="aspect-[4/5] overflow-hidden bg-gray-200 mb-6 relative">
                        <img src="${post.thumb}" class="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-105">
                        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/5 transition-colors"></div>
                    </div>
                    <div class="space-y-3">
                        <span class="text-[9px] uppercase tracking-[0.3em] font-bold text-indigo-600">${post.category}</span>
                        <h3 class="serif text-2xl leading-tight group-hover:text-black/40 transition-colors">${post.title}</h3>
                        <div class="pt-4 flex items-center
