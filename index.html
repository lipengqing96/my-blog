<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFFILIATE PULSE | Global Marketing Insights</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; color: #1a1a1a; }
        .serif { font-family: 'Playfair Display', serif; }
        .hover-lift { transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .hover-lift:hover { transform: translateY(-10px); }
    </style>
</head>
<body>

    <nav class="py-12 px-6 text-center">
        <a href="/" class="serif text-4xl font-bold italic tracking-tighter">Affiliate Pulse.</a>
        <p class="text-[10px] uppercase tracking-[0.5em] text-gray-400 mt-4">Strategies • Insights • Growth</p>
    </nav>

    <main class="max-w-7xl mx-auto px-6 pb-24">
        <div id="post-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-16">
            <div class="col-span-full py-20 text-center serif italic text-xl text-gray-300 animate-pulse">
                Syncing latest insights...
            </div>
        </div>
    </main>

    <footer class="py-20 border-t border-gray-100 text-center">
        <p class="serif italic text-gray-400">© 2026 Affiliate Pulse Magazine.</p>
    </footer>

    <script>
        const CONFIG = {
            username: "lipengqing96", 
            repo: "my-blog"
        };

        async function fetchAllPosts() {
            const grid = document.getElementById('post-grid');
            try {
                const response = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/posts?t=${Date.now()}`);
                if (!response.ok) throw new Error('API Error');
                const files = await response.json();
                const mdFiles = files.filter(f => f.name.toLowerCase().endsWith('.md')).reverse();
                
                if (mdFiles.length === 0) {
                    grid.innerHTML = '<p class="col-span-full text-center serif italic text-gray-400">No content found. Please add .md files to /posts.</p>';
                    return;
                }

                grid.innerHTML = ''; 

                for (const file of mdFiles) {
                    const res = await fetch(`${file.download_url}?t=${Date.now()}`);
                    const text = await res.text();

                    // 增强版正则解析
                    const title = text.match(/title:\s*["']?(.*?)["']?(\r?\n)/)?.[1] || "Untitled Insight";
                    const thumb = text.match(/thumbnail:\s*["']?(.*?)["']?(\r?\n)/)?.[1] || "https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=800";
                    const category = text.match(/category:\s*["']?(.*?)["']?(\r?\n)/)?.[1] || "Marketing";

                    const card = `
                        <article class="group cursor-pointer hover-lift">
                            <div class="aspect-[3/4] overflow-hidden bg-gray-100 relative mb-6">
                                <img src="${thumb}" class="w-full h-full object-cover grayscale-[30%] group-hover:grayscale-0 transition-all duration-700" alt="${title}">
                                <div class="absolute inset-0 border-[15px] border-white/0 group-hover:border-white/20 transition-all"></div>
                            </div>
                            <div class="px-2">
                                <span class="text-[9px] uppercase tracking-[0.3em] font-bold text-indigo-600 mb-2 block">${category}</span>
                                <h3 class="serif text-2xl italic leading-tight group-hover:opacity-60 transition-opacity">${title}</h3>
                                <p class="text-[10px] uppercase tracking-widest font-bold mt-4 border-b border-black inline-block pb-1">Full Story</p>
                            </div>
                        </article>
                    `;
                    grid.innerHTML += card;
                }
            } catch (err) {
                grid.innerHTML = '<p class="col-span-full text-center serif italic text-red-300">Connection Interrupted.</p>';
            }
        }
        fetchAllPosts();
    </script>
</body>
</html>
