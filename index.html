        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfc; color: #1a1a1a; margin: 0; }
        .serif { font-family: 'Playfair Display', serif; }

        /* 基础背景层 */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&q=80&w=2000');

        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.85);
            background-image: radial-gradient(#e5e7eb 0.5px, transparent 0.5px);
            background-size: 30px 30px;
            backdrop-filter: blur(10px); z-index: -1;
        }

        .glass-card { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.8); }
        .hover-lift { transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
        .hover-lift:hover { transform: translateY(-12px); box-shadow: 0 40px 80px -20px rgba(0,0,0,0.1); }
        
        .img-grayscale { filter: grayscale(100%); transition: filter 0.8s; }
        .group:hover .img-grayscale { filter: grayscale(0%); }
        
        #modal { display: none; }
        #modal.active { display: flex; opacity: 1; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        
        .prose h2 { font-family: 'Playfair Display', serif; font-size: 2.5rem; font-style: italic; font-weight: bold; margin-bottom: 1.5rem; }
        .prose p { margin-top: 1rem; line-height: 1.8; color: #4b5563; }
        
        .buy-button {
            display: inline-block; background: #000; color: #fff; padding: 12px 30px; 
            border-radius: 99px; font-weight: bold; text-decoration: none; margin: 20px 0;
            transition: transform 0.3s;
        }
        .buy-button:hover { transform: scale(1.05); background: #4f46e5; }
    </style>
</head>
