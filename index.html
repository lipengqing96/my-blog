<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全域探索 | 综合生活志</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .hero-bg { 
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
            url('https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <nav class="glass-nav sticky top-0 z-50 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="text-2xl font-black tracking-tight text-indigo-600">UNIVERSE<span class="text-slate-400">LOG</span></div>
            <div class="hidden md:flex space-x-8 text-sm font-semibold text-slate-600">
                <a href="/" class="text-indigo-600 border-b-2 border-indigo-600 pb-1">首页</a>
                <a href="#" class="hover:text-indigo-600 transition">TikTok Ads</a>
                <a href="#" class="hover:text-indigo-600 transition">体育赛事</a>
                <a href="#" class="hover:text-indigo-600 transition">关于我们</a>
            </div>
            <div class="w-10"></div> 
        </div>
    </nav>

    <header class="max-w-7xl mx-auto px-4 py-10">
        <div class="relative rounded-[2rem] overflow-hidden aspect-[21/9] md:aspect-[3/1] hero-bg shadow-2xl">
            <div class="absolute inset-0 flex flex-col justify-center p-8 md:p-16">
                <span class="text-indigo-400 font-bold tracking-widest text-sm mb-4 uppercase">Global Marketing Trends 2026</span>
                <h1 class="text-white text-3xl md:text-5xl font-bold max-w-2xl leading-tight">掌握 TikTok 流量密码：<br>从投放策略到高 ROI 转化</h1>
                <p class="text-slate-200 mt-4 max-w-lg hidden md:block text-lg">深入解析 TikTok Ads 与全球体育直播流媒体趋势，为你提供一站式深度内容参考。</p>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-12">
        <div class="flex justify-between items-end mb-12 border-l-4 border-indigo-600 pl-6">
            <div>
                <h2 class="text-3xl font-bold tracking-tight text-slate-900">最新深度内容</h2>
                <p class="text-slate-500 mt-2">Latest Insights on TikTok Ads & DAZN</p>
            </div>
        </div>

        <div id="post-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <div class="col-span-full py-20 text-center">
                <div class="inline-block w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                <p class="mt-4 text-slate-400 font-medium">正在连接知识库...</p>
            </div>
        </div>

        <section class="mt-24 bg-slate-900 rounded-[2.5rem] p-10 md:p-20 text-center text-white relative overflow-hidden">
            <div class="relative z-10">
                <h2 class="text-3xl md:text-4xl font-bold mb-6">获取出海营销干货</h2>
                <p class="text-slate-400 mb-10 max-w-md mx-auto">订阅我们的周报，第一时间获取最新的广告投放案例与流量增长秘籍。</p>
                <div class="max-w-md mx-auto flex flex-col md:flex-row gap-4">
                    <input type="email" placeholder="输入邮箱地址" class="flex-1 px-6 py-4 rounded-2xl text-slate-900 focus:ring-2 focus:ring-indigo-500 outline-none">
                    <button class="bg-indigo-600 text-white px-8 py-4 rounded-2xl font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-500/30">立即订阅</button>
                </div>
            </div>
        </section>
    </main>

    <footer class="border-t border-slate-200 pt-16 pb-8 mt-12 text-center">
        <p class="text-slate-400 text-sm font-medium">© 2026 UNIVERSELOG. 全球视野，深度链接.</p>
    </footer>

    <script>
        const GITHUB_CONFIG = {
            username: "lpqhaitao", 
            repo: "my-blog"
        };

        async function fetchPosts() {
            const grid = document.getElementById('post-grid');
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/posts`);
                if (!response.ok) throw new Error('无法读取内容');
                const files = await response.json();

                const mdFiles = files.filter(f => f.name.endsWith('.md')).reverse();
                
                if (mdFiles.length === 0) {
                    grid.innerHTML = '<p class="col-span-full text-center text-slate-400">目前还没有发布文章。</p>';
                    return;
                }

                grid.innerHTML = ''; 

                for (const file of mdFiles) {
                    const res = await fetch(file.download_url);
                    const text = await res.text();

                    const title = text.match(/title:\s*["']?(.*?)["']?(\r?\n)/)?.[1] || "未命名文章";
                    const thumb = text.match(/thumbnail:\s*["']?(.*?)["']?(\r?\n)/)?.[1] || "https://images.unsplash.com/photo-1557833006-89797f4d99ef?q=80&w=800";
                    const date = text.match(/date:\s*(.*)/)?.[1]?.split('T')[0] || "";

                    const card = `
                        <article class="group bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-500 border border-slate-100 flex flex-col">
                            <div class="relative h-60 overflow-hidden">
                                <img src="${thumb}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700" alt="${title}">
                                <div class="absolute top-4 left-4 bg-white/90 backdrop-blur-md px-3 py-1 rounded-full text-[10px] font-extrabold text-indigo-600 uppercase tracking-tighter">Insights</div>
                            </div>
                            <div class="p-8 flex-1 flex flex-col justify-between">
                                <h3 class="text-xl font-bold leading-tight group-hover:text-indigo-600 transition-colors cursor-pointer line-clamp-2">${title}</h3>
                                <div class="flex items-center mt-8 space-x-3">
                                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white text-[10px] font-bold shadow-inner">LP</div>
                                    <div class="text-[10px]">
                                        <p class="font-bold text-slate-900 uppercase">Administrator</p>
                                        <p class="text-slate-400">${date}</p>
                                    </div>
                                </div>
                            </div>
                        </article>
                    `;
                    grid.innerHTML += card;
                }
            } catch (err) {
                console.error(err);
                grid.innerHTML = '<p class="col-span-full text-center text-red-400">加载失败，请确认仓库已公开。</p>';
            }
        }

        fetchPosts();
    </script>
</body>
</html>
