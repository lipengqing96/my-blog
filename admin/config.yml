backend:
  name: github
  repo: 你的GitHub用户名/my-blog  # 这里一定要改成你的真实信息
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "文章"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "标题", name: "title", widget: "string"}
      - {label: "发布日期", name: "date", widget: "datetime"}
      - {label: "正文", name: "body", widget: "markdown"}
